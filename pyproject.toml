# pyproject.toml - Modern Python packaging configuration for PSOD
# ========================================================================

[build-system]
requires = ["setuptools>=65.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psod"
dynamic = ["version"]
description = "Pseudo-Supervised Outlier Detection using regression-based anomaly detection"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
maintainers = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
keywords = [
    "outlier-detection",
    "anomaly-detection",
    "machine-learning",
    "pseudo-supervised",
    "data-science",
    "scikit-learn"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "category-encoders>=2.3.0",
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "bokeh>=3.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.10.0",
    # Code quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.12.0",
    "pylint>=2.17.0",
    "mypy>=1.4.0",
    # Pre-commit
    "pre-commit>=3.3.0",
    # Security
    "bandit[toml]>=1.7.5",
    "safety>=2.3.0",
    "pip-audit>=2.5.0",
    # Build tools
    "build>=0.10.0",
    "twine>=4.0.0",
    "wheel>=0.40.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.10.0",
    "hypothesis>=6.75.0",
]

viz = [
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "bokeh>=3.0.0",
]

docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=1.23.0",
    "sphinxcontrib-napoleon>=0.7",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=1.0.0",
    "nbsphinx>=0.9.2",
    "pandoc>=2.3",
    "ipykernel>=6.23.0",
    "interrogate>=1.5.0",
]

benchmark = [
    "memory_profiler>=0.61.0",
    "line_profiler>=4.0.0",
    "py-spy>=0.3.14",
    "tabulate>=0.9.0",
]

all = [
    "psod[dev,test,viz,docs,benchmark]"
]

[project.urls]
Homepage = "https://github.com/diogoribeiro7/PSOD"
Documentation = "https://psod.readthedocs.io"
Repository = "https://github.com/diogoribeiro7/PSOD"
"Bug Tracker" = "https://github.com/diogoribeiro7/PSOD/issues"
Changelog = "https://github.com/diogoribeiro7/PSOD/blob/main/CHANGELOG.md"

[project.scripts]
psod = "psod.cli:main"

# ========================================================================
# Tool Configurations
# ========================================================================

[tool.setuptools]
packages = ["psod"]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
psod = ["py.typed", "*.pyi"]

[tool.setuptools_scm]
write_to = "src/psod/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

# ========================================================================
# Black Configuration
# ========================================================================

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | docs/_build
)/
'''

# ========================================================================
# isort Configuration
# ========================================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["docs/*", "build/*", "dist/*"]

# ========================================================================
# Pytest Configuration
# ========================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmarks",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/psod"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/_version.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ========================================================================
# Mypy Configuration
# ========================================================================

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "category_encoders.*",
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
]
ignore_missing_imports = true

# ========================================================================
# Pylint Configuration
# ========================================================================

[tool.pylint.main]
py-version = "3.8"
jobs = 0
load-plugins = [
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
    "C0103",  # invalid-name
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-branches = 15
max-locals = 20
max-returns = 8
max-statements = 60

# ========================================================================
# Bandit Configuration
# ========================================================================

[tool.bandit]
targets = ["src/psod"]
exclude_dirs = ["tests", "docs", "build", "dist"]
skips = ["B101", "B601"]
severity = "medium"

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]

# ========================================================================
# Ruff Configuration (Alternative linter)
# ========================================================================

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "docs/_build",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101"]

[tool.ruff.isort]
known-first-party = ["psod"]

# ========================================================================
# Interrogate Configuration (Docstring Coverage)
# ========================================================================

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
fail-under = 80
exclude = ["setup.py", "docs", "build", "tests"]
verbose = 2
quiet = false
color = true
generate-badge = "docs/_static"
badge-format = "svg"
