name: Temporary Core Autofmt

on:
  push:
    branches:
      - refactor/03b-core-progress-cleanup

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/03b-core-progress-cleanup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install black==26.5.1
      - run: black src/psod/core.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/psod/core.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/psod/core.py
          git commit -m "style: format core cleanup"
          git push origin HEAD:refactor/03b-core-progress-cleanup
