name: Documentation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'src/psod/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'src/psod/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper version detection

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
          pip install myst-parser sphinxcontrib-napoleon sphinx-copybutton
          pip install nbsphinx pandoc ipykernel

      - name: Check documentation requirements
        run: |
          cd docs
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build Sphinx documentation
        run: |
          cd docs
          make clean
          make html SPHINXOPTS="--keep-going"

      - name: Check for broken links
        run: |
          cd docs
          make linkcheck
        continue-on-error: true

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html/

      - name: Create documentation summary
        run: |
          echo "## 📚 Documentation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Documentation built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY

  test-notebooks:
    name: Test Jupyter Notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
          pip install jupyter nbconvert nbformat
          pip install matplotlib seaborn statsmodels

      - name: Test notebook execution
        run: |
          cd examples/notebooks
          for notebook in *.ipynb; do
            echo "Testing $notebook..."
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=600 \
              --output-dir=/tmp \
              "$notebook" || echo "Warning: $notebook failed"
          done
        continue-on-error: true

  validate-examples:
    name: Validate Example Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Validate Python syntax in examples
        run: |
          python -m py_compile examples/*.py
          echo "✅ All example files have valid Python syntax" >> $GITHUB_STEP_SUMMARY

      - name: Check code style in examples
        run: |
          pip install black isort
          black --check examples/ || echo "⚠️ Examples need formatting"
          isort --check-only examples/ || echo "⚠️ Imports need sorting"
        continue-on-error: true

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-docs, test-notebooks, validate-examples]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install sphinx sphinx-rtd-theme

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Add .nojekyll file
        run: |
          touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation from ${{ github.sha }}'

      - name: Documentation deployment summary
        run: |
          echo "## 🚀 Documentation Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Documentation has been deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 View at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

  documentation-coverage:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
          pip install interrogate

      - name: Check docstring coverage
        run: |
          interrogate -v src/psod/ \
            --fail-under 80 \
            --ignore-init-method \
            --ignore-private \
            --ignore-magic \
            --quiet-level 0 \
            || echo "⚠️ Docstring coverage below 80%"

      - name: Create coverage report
        run: |
          interrogate src/psod/ --generate-badge docs/_static/ || true
          echo "## 📝 Docstring Coverage" >> $GITHUB_STEP_SUMMARY
          interrogate src/psod/ >> $GITHUB_STEP_SUMMARY || true

  all-docs-checks-pass:
    name: All Documentation Checks Passed
    runs-on: ubuntu-latest
    needs:
      - build-docs
      - test-notebooks
      - validate-examples
      - documentation-coverage
    steps:
      - name: Success
        run: |
          echo "✅ All documentation checks passed successfully!" >> $GITHUB_STEP_SUMMARY
