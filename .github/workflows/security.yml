name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, SSPL-1.0

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  bandit-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install scanner
        run: python -m pip install "bandit[toml]"
      - name: Run Bandit
        run: bandit -r src/psod -c .bandit -ll

  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83" wheel
          python -m pip install .
          python -m pip install pip-audit
      - name: Generate machine-readable audit reports
        run: |
          pip-audit --desc --format json --output pip-audit-report.json || true
          pip-audit --desc --format cyclonedx-json --output pip-audit-sbom.json || true
      - name: Enforce dependency audit
        run: pip-audit --desc
      - name: Upload pip-audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-scan
          path: |
            pip-audit-report.json
            pip-audit-sbom.json

  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/bandit
            p/owasp-top-ten

  trivy-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce Trivy vulnerability policy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan
          path: |
            trivy-results.sarif
            trivy-report.txt

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog OSS (PR)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@30a032af512f08a1d4e7d1aaf0d4119ad6910d63
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
      - name: TruffleHog OSS (push/schedule)
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: trufflesecurity/trufflehog@30a032af512f08a1d4e7d1aaf0d4119ad6910d63
        with:
          path: ./
          extra_args: --only-verified

  license-check:
    name: Dependency License Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and reporter
        run: |
          python -m pip install --upgrade "setuptools>=83" wheel
          python -m pip install .
          python -m pip install pip-licenses
      - name: Generate dependency license report
        run: |
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=markdown --output-file=licenses.md
      - name: Reject incompatible network/server-side dependency licenses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          prohibited = ("AGPL-3.0", "SSPL")
          licenses = json.loads(Path("licenses.json").read_text(encoding="utf-8"))
          violations = [
              f"{pkg['Name']} ({pkg.get('License', '')})"
              for pkg in licenses
              if any(token in pkg.get("License", "") for token in prohibited)
          ]
          if violations:
              raise SystemExit("Prohibited dependency licenses: " + ", ".join(violations))
          PY
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: |
            licenses.json
            licenses.md

  security-summary:
    name: Security Scan Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - codeql-analysis
      - bandit-scan
      - pip-audit
      - semgrep-scan
      - trivy-scan
      - secrets-scan
      - license-check
    steps:
      - name: Fail if a required scan failed
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql-analysis.result }}
          BANDIT: ${{ needs.bandit-scan.result }}
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          SEMGREP: ${{ needs.semgrep-scan.result }}
          TRIVY: ${{ needs.trivy-scan.result }}
          SECRETS: ${{ needs.secrets-scan.result }}
          LICENSES: ${{ needs.license-check.result }}
        run: |
          printf '%s\n' \
            "Dependency review=$DEPENDENCY_REVIEW" \
            "CodeQL=$CODEQL" \
            "Bandit=$BANDIT" \
            "pip-audit=$PIP_AUDIT" \
            "Semgrep=$SEMGREP" \
            "Trivy=$TRIVY" \
            "Secrets=$SECRETS" \
            "Licenses=$LICENSES"
          test "$DEPENDENCY_REVIEW" = success || test "$DEPENDENCY_REVIEW" = skipped
          test "$CODEQL" = success
          test "$BANDIT" = success
          test "$PIP_AUDIT" = success
          test "$SEMGREP" = success
          test "$TRIVY" = success
          test "$SECRETS" = success
          test "$LICENSES" = success
