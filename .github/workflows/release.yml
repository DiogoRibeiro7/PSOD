name: Release Validation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build distribution artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

  test-package:
    name: Test built package on Python ${{ matrix.python-version }}
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/
      - name: Install and smoke-test wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "from psod import PSOD; print(PSOD)"

  publication-disabled:
    name: Publication intentionally disabled
    needs: [test-package]
    runs-on: ubuntu-latest
    steps:
      - name: Explain release policy
        run: |
          echo "PyPI publication is intentionally disabled during the refactor."
          echo "The distribution name 'psod' belongs to the earlier PSOD project."
          echo "Choose and validate a new distribution identity before enabling publication."
