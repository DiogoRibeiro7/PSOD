name: Temporary Input Boundary Refactor

on:
  push:
    branches:
      - refactor/03c-input-boundary

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/03c-input-boundary
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply surgical core delegates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/psod/core.py")
          text = path.read_text()

          import_anchor = "from sklearn.preprocessing import PowerTransformer, QuantileTransformer\n"
          import_line = (
              "from ._input import convert_datetime_columns, to_dataframe, validate_input\n"
          )
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_datetime = '''    def _convert_datetime_columns(self, df: pd.DataFrame) -> pd.DataFrame:\n        \"\"\"Convert datetime columns to numeric if enabled.\"\"\"\n        if not self.auto_convert_datetime:\n            return df\n\n        datetime_cols = df.select_dtypes(include=[\"datetime64[ns]\", \"datetime64[ns, UTC]\"]).columns\n        if len(datetime_cols) == 0:\n            return df\n\n        df_converted = df.copy()\n        for col in datetime_cols:\n            # Use astype to avoid pandas FutureWarning about Series.view\n            df_converted[col] = df_converted[col].astype(\"int64\")\n\n        logger.info(f\"Converted datetime columns to numeric: {list(datetime_cols)}\")\n        return df_converted\n'''
          new_datetime = '''    def _convert_datetime_columns(self, df: pd.DataFrame) -> pd.DataFrame:\n        \"\"\"Convert datetime columns to numeric if enabled.\"\"\"\n        return convert_datetime_columns(df, enabled=self.auto_convert_datetime)\n'''

          old_dataframe = '''    def _to_dataframe(self, X: Union[pd.DataFrame, np.ndarray]) -> pd.DataFrame:\n        \"\"\"\n        Convert input to DataFrame if necessary (sklearn compatibility).\n\n        Parameters\n        ----------\n        X : pd.DataFrame or np.ndarray\n            Input data\n\n        Returns\n        -------\n        pd.DataFrame\n            Input converted to DataFrame\n        \"\"\"\n        if isinstance(X, pd.DataFrame):\n            return X\n        elif isinstance(X, np.ndarray):\n            # Create DataFrame with default column names\n            n_features = X.shape[1] if X.ndim > 1 else 1\n            if self.feature_names_ is not None:\n                # Use stored feature names if available\n                columns = self.feature_names_\n            else:\n                columns = [f\"feature_{i}\" for i in range(n_features)]\n            return pd.DataFrame(X, columns=columns)\n        else:\n            raise TypeError(f\"Expected DataFrame or ndarray, got {type(X)}\")\n'''
          new_dataframe = '''    def _to_dataframe(self, X: Union[pd.DataFrame, np.ndarray]) -> pd.DataFrame:\n        \"\"\"Convert input to DataFrame if necessary (sklearn compatibility).\"\"\"\n        return to_dataframe(X, feature_names=self.feature_names_)\n'''

          for old, new, label in [
              (old_datetime, new_datetime, "datetime"),
              (old_dataframe, new_dataframe, "dataframe"),
          ]:
              if old not in text:
                  raise SystemExit(f"Expected {label} block not found")
              text = text.replace(old, new, 1)

          start = text.index("    def _validate_input(self, df: pd.DataFrame, is_training: bool = True) -> None:\n")
          end = text.index("    def _handle_missing_values", start)
          new_validate = '''    def _validate_input(self, df: pd.DataFrame, is_training: bool = True) -> None:\n        \"\"\"Validate input DataFrame against the estimator's current fit state.\"\"\"\n        validate_input(\n            df,\n            is_training=is_training,\n            min_samples=self.min_samples,\n            cat_columns=self.cat_columns,\n            is_fitted=self._is_fitted,\n            feature_names=self.feature_names_,\n        )\n\n'''
          text = text[:start] + new_validate + text[end:]
          path.write_text(text)
          PY
      - run: python -m pip install black==26.5.1
      - run: black src/psod/core.py src/psod/_input.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/psod/core.py src/psod/_input.py
          git commit -m "refactor: delegate stateless input handling" || exit 0
          git push origin HEAD:refactor/03c-input-boundary
