# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools
build:
  os: ubuntu-22.04
  tools:
    python: "3.9"
  apt_packages:
    - pandoc
  jobs:
    post_build:
      # Run link checker
      - cd docs && make linkcheck || true

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Optionally set the formats of your built documentation
formats:
  - pdf
  - epub
  - htmlzip

# Explicitly set Python requirements
python:
  install:
    - requirements: requirements.txt
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - docs

# Optional: submodules configuration
# submodules:
#   include: all
#   recursive: true
